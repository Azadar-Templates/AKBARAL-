# AKBARAL! — publish the production image to GHCR.
#
# Zero infrastructure cost: GitHub Actions is free and unlimited on public
# repositories, and the built-in GITHUB_TOKEN can push to ghcr.io with
# packages:write — no user configuration, no secrets, no card.
#
# The image is what ClawCloud Run / any Docker host deploys:
#   ghcr.io/azadar-templates/akbaral-:latest   (rolling)
#   ghcr.io/azadar-templates/akbaral-:<sha>    (immutable, rollback)
#
# linux/amd64 only by design: the zero-cost hosts (ClawCloud Run) run
# amd64 nodes; ARM builds can be added later if ever needed.

name: docker-publish

on:
  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "docs/**"
      - "design-system/**"
      - "mobile/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase; strip trailing non-alphanumerics
          so "AKBARAL-" becomes the valid repository "akbaral")
        run: |
          NAME=$(printf '%s' "${GITHUB_REPOSITORY,,}" | sed -E 's/[^a-z0-9]+$//')
          echo "IMAGE=ghcr.io/${NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${NAME##*/}" >> "$GITHUB_ENV"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image (commit stamp + compiled PostgreSQL fix)
        # Pulls EXACTLY the digest that was pushed (not a mutable tag) and
        # fails the workflow unless the image provably contains this commit's
        # code — a stale or half-built :latest can never pass silently.
        run: |
          DIGEST="sha256:${{ steps.build.outputs.digest }}"
          echo "published digest: ${IMAGE}@${DIGEST}"
          docker pull "${IMAGE}@${DIGEST}"
          STAMP=$(docker run --rm "${IMAGE}@${DIGEST}" cat /app/.image-version)
          echo "image .image-version: ${STAMP}"
          if [ "${STAMP}" != "${{ github.sha }}" ]; then
            echo "::error::image stamp mismatch — the published image was not built from this commit"
            exit 1
          fi
          docker run --rm             -e FIX="::json->>'"             -e BUG='::json->>"'             "${IMAGE}@${DIGEST}" node -e '
              const fs = require("fs");
              const code = fs.readFileSync("/app/dist/src/db/database.js", "utf8");
              if (!code.includes(process.env.FIX)) {
                console.error("FAIL: single-quoted json_extract translation missing from compiled image");
                process.exit(1);
              }
              if (code.includes(process.env.BUG)) {
                console.error("FAIL: old double-quoted json_extract translation still present in compiled image");
                process.exit(1);
              }
              console.log("image verification OK: PostgreSQL json_extract fix compiled in; old form absent");
            '

      - name: Make package public (idempotent; public repo => public image)
        run: |
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/user/packages/container/${IMAGE_NAME}/visibility" \
            >/dev/null 2>&1 && echo "visibility: public ensured" || echo "visibility: left as-is (check manually)"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
