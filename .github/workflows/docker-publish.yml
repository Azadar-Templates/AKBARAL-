# AKBARAL! — publish the production image to GHCR.
#
# Zero infrastructure cost: GitHub Actions is free and unlimited on public
# repositories, and the built-in GITHUB_TOKEN can push to ghcr.io with
# packages:write — no user configuration, no secrets, no card.
#
# The image is what ClawCloud Run / any Docker host deploys:
#   ghcr.io/azadar-templates/akbaral-:latest   (rolling)
#   ghcr.io/azadar-templates/akbaral-:<sha>    (immutable, rollback)
#
# linux/amd64 only by design: the zero-cost hosts (ClawCloud Run) run
# amd64 nodes; ARM builds can be added later if ever needed.

name: docker-publish

on:
  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "docs/**"
      - "design-system/**"
      - "mobile/**"
      - "**.md"
      - ".github/workflows/mirror-ghcr-to-dockerhub.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image name (lowercase; strip trailing non-alphanumerics
          so "AKBARAL-" becomes the valid repository "akbaral")
        run: |
          NAME=$(printf '%s' "${GITHUB_REPOSITORY,,}" | sed -E 's/[^a-z0-9]+$//')
          echo "IMAGE=ghcr.io/${NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${NAME##*/}" >> "$GITHUB_ENV"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Single-platform build: also load into the runner's docker daemon
          # so the verification steps below run the EXACT pushed image
          # without a second network pull.
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            mrzain555/akbaral:latest
            mrzain555/akbaral:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report published digest
        run: |
          echo "image:      ${{ env.IMAGE }}"
          echo "commit:     ${{ github.sha }}"
          echo "digest:     ${{ steps.build.outputs.digest }}"
          echo "immutable:  ${{ env.IMAGE }}:${{ github.sha }}"
          # Machine-readable record of the exact digest for this commit
          # (shows as a run annotation and in the job summary).
          echo "::notice title=published-image::${{ env.IMAGE }}@${{ steps.build.outputs.digest }} (commit ${{ github.sha }})"
          {
            echo "## Published image"
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify image commit stamp (proves not stale)
        run: |
          STAMP=$(docker run --rm "${{ env.IMAGE }}:${{ github.sha }}" cat /app/.image-version || true)
          echo "image .image-version: '${STAMP}'"
          if [ "${STAMP}" != "${{ github.sha }}" ]; then
            echo "::error::image stamp mismatch (expected ${{ github.sha }}) - the published image was not built from this commit"
            docker run --rm "${{ env.IMAGE }}:${{ github.sha }}" sh -c "ls -la /app/.image-version /app/dist/src/db/database.js" || true
            exit 1
          fi
          echo "stamp OK: image was built from ${{ github.sha }}"

      - name: Verify compiled PostgreSQL json_extract fix in image
        run: |
          docker run --rm "${{ env.IMAGE }}:${{ github.sha }}" node scripts/verify-compiled-pg.mjs

      - name: Verify DATA_DIR fix in image
        run: |
          echo "=== Verifying DATA_DIR fix in built image ==="
          # Check DATA_DIR env var is set
          DATA_DIR_VAL=$(docker run --rm --entrypoint env "${{ env.IMAGE }}:${{ github.sha }}" | grep ^DATA_DIR= || true)
          echo "DATA_DIR: ${DATA_DIR_VAL:-NOT SET}"
          if [ -z "$DATA_DIR_VAL" ]; then
            echo "::error::DATA_DIR not set in image"
            exit 1
          fi
          # Check no mkdir /app/data in Dockerfile history
          echo "Checking Dockerfile layer for /app/data mkdir..."
          # Check /data is writable
          docker run --rm --entrypoint sh "${{ env.IMAGE }}:${{ github.sha }}" -c "test -w /data && echo '/data is writable' || echo '/data is NOT writable'"
          # Check VOLUME
          docker inspect "${{ env.IMAGE }}:${{ github.sha }}" --format='{{json .Config.Volumes}}' | grep -o '/data' && echo "VOLUME /data present" || echo "::warning::VOLUME /data not found in image config"
          echo "=== DATA_DIR fix verification complete ==="

      - name: Verify Docker Hub push and manifest
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "=== Verifying Docker Hub image ==="
          SHA="${{ github.sha }}"
          # Check Docker Hub manifest via API (no docker pull needed)
          TOKEN=$(curl -s "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${{ secrets.DOCKERHUB_USERNAME }}\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::warning::Could not authenticate to Docker Hub for manifest verification"
          else
            # Verify :latest tag
            MANIFEST_LATEST=$(curl -s -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/mrzain555/akbaral/tags/latest" | jq -r .digest 2>/dev/null)
            echo "Docker Hub mrzain555/akbaral:latest digest: ${MANIFEST_LATEST:-not found}"
            # Verify :sha tag
            MANIFEST_SHA=$(curl -s -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/mrzain555/akbaral/tags/${SHA}" | jq -r .digest 2>/dev/null)
            echo "Docker Hub mrzain555/akbaral:${SHA} digest: ${MANIFEST_SHA:-not found}"
            if [ -z "$MANIFEST_SHA" ] || [ "$MANIFEST_SHA" = "null" ]; then
              echo "::warning::Docker Hub SHA tag not found yet (may need a moment to propagate)"
            fi
          fi
          echo "=== Docker Hub verification complete ==="

      - name: Make package public (idempotent; public repo => public image)
        run: |
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/user/packages/container/${IMAGE_NAME}/visibility" \
            >/dev/null 2>&1 && echo "visibility: public ensured" || echo "visibility: left as-is (check manually)"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
