name: "gemini-live-verify (TEMPORARY - delete after use)"

on:
  push:
    branches: ["arena/01a0b101-akbaral"]
    paths: [".github/workflows/gemini-live-verify.yml"]

permissions:
  contents: read

jobs:
  live-verify:
    name: "One real MASTER task against Google Gemini on main (temp DB, non-owner user)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout current main branch"
        uses: actions/checkout@v4
        with:
          ref: main

      - name: "Setup Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Install dependencies"
        run: npm ci

      - name: "Gate - fail fast and honestly if the secret is missing"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error title=ev0.secret::GOOGLE_API_KEY repository secret is NOT set - add it in Settings > Secrets and variables > Actions, then re-run this workflow"
            exit 1
          fi
          echo "::notice title=ev0.secret::GOOGLE_API_KEY secret is present (value never printed)"

      - name: "Prepare temporary test database (not production)"
        env:
          DATABASE_URL: "file:./tmp-verify.db"
        run: |
          npx tsx src/db/migrate.ts
          npx tsx src/db/seed.ts

      - name: "Start isolated test server with the Gemini credential"
        env:
          DATABASE_URL: "file:./tmp-verify.db"
          SESSION_SECRET: "live-verify-ephemeral-secret-do-not-reuse-0123456789"
          NODE_ENV: production
          PORT: "4001"
          AKBARAL_API_PORT: "4001"
          AKBARAL_ROLES: "api"
          AKBARAL_AUTO_BUILD: "false"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          nohup npx tsx src/index.ts > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4001/api/health > /dev/null 2>&1; then
              echo "server healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sS http://127.0.0.1:4001/api/health || { echo "::error title=ev0.server::server failed to start"; tail -30 server.log; exit 1; }

      - name: "Run ONE real MASTER task as a non-owner test user and collect evidence"
        env:
          DATABASE_URL: "file:./tmp-verify.db"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set +e
          API=http://127.0.0.1:4001

          curl -sS -X POST $API/api/auth/register -H 'content-type: application/json' \
            -d '{"email":"gemini-verify@akbaral.test","password":"gemini-verify-password-1","name":"Gemini Verify"}' > register.json
          python3 -c "import json; d=json.load(open('register.json')); print('registered role:', d['user']['role'])" | tee role.txt

          LOGIN=$(curl -sS -X POST $API/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"gemini-verify@akbaral.test","password":"gemini-verify-password-1"}')
          TOKEN=$(echo "$LOGIN" | python3 -c "import json,sys; print(json.load(sys.stdin)['accessToken'])")

          MASTER_RESP=$(curl -sS -X POST $API/api/master -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"goal":"Write a short factual summary of how solar panels generate electricity."}')
          echo "$MASTER_RESP" > master-response.json
          WF=$(python3 -c "import json; print(json.load(open('master-response.json'))['workflow']['id'])")
          echo "workflow id: $WF"

          FINAL_STATUS=""
          for i in $(seq 1 60); do
            STATE=$(curl -sS $API/api/master/$WF -H "authorization: Bearer $TOKEN")
            FINAL_STATUS=$(echo "$STATE" | python3 -c "import json,sys; print(json.load(sys.stdin)['workflow']['status'])" 2>/dev/null)
            if [ "$FINAL_STATUS" = "completed" ] || [ "$FINAL_STATUS" = "failed" ]; then break; fi
            sleep 2
          done
          echo "$STATE" > master-final.json

          cat > evidence.mts <<'EV'
          import { DatabaseSync } from 'node:sqlite';
          import fs from 'node:fs';
          const db = new DatabaseSync('./tmp-verify.db');
          const notice = (title: string, body: string) => console.log(`::notice title=${title}::${body.replace(/\n/g, ' | ').slice(0, 900)}`);
          const err = (title: string, body: string) => console.log(`::error title=${title}::${body.replace(/\n/g, ' | ').slice(0, 900)}`);

          const final = JSON.parse(fs.readFileSync('master-final.json', 'utf8'));
          const wstatus = final?.workflow?.status ?? 'unknown';
          const analysisMode = JSON.parse(fs.readFileSync('master-response.json', 'utf8'))?.analysis?.mode ?? 'unknown';

          // EV1 - model_runs row
          const runs = db.prepare('SELECT provider_key, model_key, status, input_tokens, output_tokens, latency_ms, error_message FROM model_runs ORDER BY created_at').all();
          if (runs.length === 0) { err('ev1.model_run', 'FAIL - model_runs table is EMPTY (no LLM call was recorded)'); }
          else {
            for (const r of runs) {
              const ok = r.provider_key === 'google' && r.status === 'succeeded' && Number(r.input_tokens ?? 0) > 0;
              (ok ? notice : err)('ev1.model_run',
                `${ok ? 'PASS' : 'FAIL'} provider=${r.provider_key} model=${r.model_key} status=${r.status} input_tokens=${r.input_tokens} output_tokens=${r.output_tokens} latency_ms=${r.latency_ms}${r.error_message ? ' error=' + r.error_message : ''}`);
            }
          }

          // EV2 - workflow status
          (wstatus === 'completed' ? notice : err)('ev2.workflow_status',
            `${wstatus === 'completed' ? 'PASS' : 'FAIL'} MASTER workflow status=${wstatus} goalAnalysisMode=${analysisMode}`);

          // EV3 - verification produced real output
          const execs = db.prepare('SELECT status, output_data, error_message FROM agent_executions ORDER BY created_at').all();
          let ev3 = false;
          for (const e of execs) {
            let v: any = null; let contentLen = 0;
            try { const o = JSON.parse(String(e.output_data ?? '')); v = o?.verification ?? null; contentLen = String(o?.content ?? '').length; } catch {}
            if (e.status === 'completed' && v?.passed === true && contentLen > 0) {
              ev3 = true;
              notice('ev3.verification', `PASS agent execution completed; verification mode=${v.mode} score=${v.score} checks=${(v.checks ?? []).map((c: any) => c.name + (c.passed ? ':pass' : ':fail')).join(',')} output_chars=${contentLen}`);
            } else {
              err('ev3.verification', `FAIL execution status=${e.status} verification_passed=${v?.passed ?? 'n/a'} error=${e.error_message ?? 'none'}`);
            }
          }
          if (execs.length === 0) err('ev3.verification', 'FAIL - no agent executions recorded');

          // EV4 - credit consumed on success, no refund
          const tx = db.prepare("SELECT type, amount, balance_after, reason, task_id FROM credit_transactions ORDER BY created_at").all();
          const consumed = tx.filter((t) => t.type === 'consume_task');
          const refunded = tx.filter((t) => t.type === 'refund_task');
          const acct = db.prepare('SELECT free_credits, free_credits_used FROM credit_accounts LIMIT 1').get();
          if (wstatus === 'completed' && consumed.length >= 1 && refunded.length === 0 && Number(acct?.free_credits_used ?? 0) >= 1) {
            notice('ev4.credits', `PASS consume_task rows=${consumed.length} (amount=${consumed[0].amount}, balance_after=${consumed[0].balance_after}), refund_task rows=0, free_credits_used=${acct?.free_credits_used}`);
          } else {
            err('ev4.credits', `FAIL workflow=${wstatus} consume_rows=${consumed.length} refund_rows=${refunded.length} free_credits_used=${acct?.free_credits_used}`);
          }

          // EV5 - task.completed audit entry
          const audit = db.prepare("SELECT action, resource_type, resource_id, description FROM audit_logs WHERE action = 'task.completed' ORDER BY created_at DESC LIMIT 3").all();
          if (audit.length > 0) {
            notice('ev5.audit', `PASS task.completed audit rows=${audit.length} first=${JSON.stringify(audit[0])}`);
          } else {
            err('ev5.audit', 'FAIL - no task.completed audit log entry exists');
          }

          const fr = final?.finalResult;
          notice('ev6.final_result', `status=${fr?.status ?? 'none'} mode=${fr?.mode ?? 'none'} summary=${String(fr?.executiveSummary ?? '').slice(0, 300)}`);
          EV
          npx tsx evidence.mts

          echo ""
          echo "=== server log tail (provider errors, if any) ==="
          grep -iE "provider|gemini|google|error" server.log | tail -10 || true
          if [ "$FINAL_STATUS" != "completed" ]; then exit 1; fi
