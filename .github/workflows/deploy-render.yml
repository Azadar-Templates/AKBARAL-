name: deploy-render

# Redeploys the LATEST CI image on the Render free production service and
# runs the full REAL production E2E against it (Modal is no longer the
# production dependency — see deploy/free-render/README.md).
#
# Required repository secrets (one-time, user-side, free):
#   RENDER_DEPLOY_HOOK  — Render dashboard → akbaral service → Settings →
#                         Deploy Hook (triggers "deploy latest reference")
#   PRODUCTION_BASE_URL — e.g. https://akbaral-xxxx.onrender.com
#
# If the secrets are not set yet, this workflow skips gracefully with the
# setup instructions instead of failing.

on:
  workflow_dispatch: {}

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Trigger the Render deploy hook (pull the latest image)
        if: ${{ env.DEPLOY_HOOK != '' }}
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          code=$(curl -s -o /tmp/hook-body -w '%{http_code}' -X POST --max-time 60 "$DEPLOY_HOOK")
          echo "deploy hook -> HTTP $code"
          cat /tmp/hook-body || true
          test "$code" = "200"

      - name: Wait for the service to become healthy
        if: ${{ env.BASE_URL != '' && env.DEPLOY_HOOK != '' }}
        env:
          BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE_URL/api/health" || true)
            echo "attempt $i: /api/health -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::error title=service unhealthy::Render service did not return 200 on /api/health within 10 minutes"
          exit 1

      - name: Run the REAL production E2E (MASTER flow via Gemini)
        if: ${{ env.BASE_URL != '' }}
        env:
          AKBARAL_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: node scripts/verify-production-e2e.mjs

      - name: Not configured yet — skip with instructions
        if: ${{ env.BASE_URL == '' }}
        env:
          BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: |
          echo "PRODUCTION_BASE_URL (and/or RENDER_DEPLOY_HOOK) is not set."
          echo "One-time setup: see deploy/free-render/README.md — create the Render"
          echo "Blueprint, then add PRODUCTION_BASE_URL and RENDER_DEPLOY_HOOK as"
          echo "repository secrets. Nothing was deployed from this run."
