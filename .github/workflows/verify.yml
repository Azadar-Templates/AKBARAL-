name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
      - run: npm ci
      - name: Types and secret-handling gate
        run: |
          npm run typecheck
          npm run scan:secrets
      - name: Full SQLite suite (includes mission, isolation, billing and workforce)
        run: npm test
      - name: Preserve SQLite checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/test-checkpoints/**/checkpoint.json
            logs/test-checkpoints/**/output.tap
            logs/test-checkpoints/**/passed.db
          if-no-files-found: ignore
          retention-days: 7
      - name: PostgreSQL platform and workforce parity
        run: npm run test:pg
      - name: Standalone mission PostgreSQL parity
        run: npm run mission:pg-check
      - name: Private mission Chromium desktop and mobile-viewport checks
        env:
          MISSION_BROWSER_NPM_RUNTIME: "true"
          MISSION_BROWSER_EVIDENCE_DIR: logs/browser/ci
        run: npm run mission:browser-check
      - name: Preserve browser screenshots and source fingerprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/browser/ci/*.png
            logs/browser/ci/result.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Production Webpack build with PostgreSQL runtime assets
        run: npm run build:webpack
      - name: Exercise the compiled PostgreSQL worker, not just TypeScript sources
        run: node scripts/pg-test-server.mjs --run node dist/src/db/migrate.js --status

# No production secrets, external model/payment calls, deploys, autonomy or
# fabricated live proof. All databases and financial evidence above are test
# fixtures on the runner; docker publication remains a separate workflow.
