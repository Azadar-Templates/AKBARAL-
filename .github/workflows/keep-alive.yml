name: keep-alive

# Free-tier production hosts spin down idle services (Zeabur Free Plan:
# services sleep when idle and wake on the next request). AKBARAL! runs its
# execution queue and automation scheduler in-process, so a sleeping service
# stalls tasks. This scheduled ping keeps production awake — and it doubles
# as an external production heartbeat in the Actions history.
#
# Runs every 13 minutes (provider-neutral: works with any host URL).
#
# One-time setup: add the repository secret
#   PRODUCTION_PING_URL = https://<your-production-url>
# Until it exists, every run skips gracefully (no failures, no noise).

on:
  schedule:
    - cron: '*/13 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping production /api/health
        if: ${{ env.PING_URL != '' }}
        env:
          PING_URL: ${{ secrets.PRODUCTION_PING_URL }}
        run: |
          code=$(curl -s -o /tmp/health-body -w '%{http_code}' --max-time 30 "$PING_URL/api/health" || true)
          echo "$(date -u +%FT%TZ) $PING_URL/api/health -> HTTP $code"
          cat /tmp/health-body 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::warning title=production heartbeat::/api/health returned $code (service may be cold-starting or unhealthy — retry manually if this persists)"
          fi

      - name: Not configured yet — skip silently
        if: ${{ env.PING_URL == '' }}
        env:
          PING_URL: ${{ secrets.PRODUCTION_PING_URL }}
        run: |
          echo "PRODUCTION_PING_URL not set — nothing to ping (setup: deploy/free-render/README.md)."
